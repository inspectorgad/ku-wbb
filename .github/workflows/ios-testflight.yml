name: iOS TestFlight build

# Builds the iPhone app on one of GitHub's Macs and sends it to TestFlight,
# from where it installs on the phone. Runs by hand, or when the iPhone app
# changes on a branch.
#
# Signing happens at upload, not at build: the archive is built unsigned and
# `xcodebuild -exportArchive`, given the App Store Connect key, signs it with
# a distribution certificate Apple keeps for the team ("cloud signing"). That
# needs no certificate stored in this repository and no registered device,
# which a new developer account does not have. The key must be an Admin one -
# a lower role cannot use the team's cloud-managed certificate, and fails
# here rather than at the keys check.
#
# The app's screens and logic are the shared Kotlin code in shared/, which
# Xcode builds into Shared.framework through Gradle as a step of its own
# build (see ios/project.yml), so this job sets up Java and Gradle too.
# ios-shared.yml compiles that same code without signing anything, and is the
# cheaper place to find a Kotlin error.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'ios/**'
      - '!ios/check_apple_keys.py'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # Kotlin 2.4.21 is tested with Xcode up to 26.4; the runner's default is
      # newer. 26.4 still meets App Store Connect's Xcode 26 requirement.
      - name: Use Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer || { ls /Applications | grep Xcode; exit 1; }
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      # Kotlin/Native's compiler and its iOS libraries, about 1 GB, fetched
      # once; shared with ios-shared.yml, which uses the same key.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # A branch build is a test build, and the pack it would otherwise read
      # is main's: Ask Claude would be offered this branch's screens over last
      # week's tables and prompt, which is the one way a test of it can mislead.
      # Pinned to the commit, not the branch, so the build keeps reading the
      # data it was built against however the branch moves on. Must come before
      # the Gradle link below, which compiles this file. Twin of the step in
      # build-apk.yml.
      - name: Point Ask Claude at this branch's data
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/docs/ask-data.json"
          file=shared/src/commonMain/kotlin/com/example/data/AskEngine.kt
          grep -q 'https://inspectorgad.github.io/ku-wbb/ask-data.json' "$file"
          sed -i "s|\( *\)\(\"https://inspectorgad.github.io/ku-wbb/ask-data.json\",\)|\1\"$url\",\n\1\2|" "$file"
          sed -n '/val PACK_URLS/,/)/p' "$file"

      # The same link Xcode's build step asks for, run first so a Kotlin error
      # reads plainly here rather than deep in the Xcode log; Xcode then finds
      # it already done.
      - name: Build the shared Kotlin framework
        run: gradle :shared:linkReleaseFrameworkIosArm64

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the archive
        run: |
          # Run number and attempt, so a re-run still uploads a new build number.
          xcodebuild archive \
            -project ios/KUWBB.xcodeproj \
            -scheme KUWBB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KUWBB.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          # Internal testing only: the build goes to testers on this team
          # and never to Apple's beta review.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KUWBB.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Say what happens next
        run: |
          echo "Uploaded build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT."
          echo "Apple takes 5-30 minutes to process it; it then appears in the"
          echo "TestFlight app on any iPhone signed in with the team's Apple ID."
