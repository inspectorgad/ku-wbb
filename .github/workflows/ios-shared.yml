name: iPhone shared code

# Compiles the shared module for iPhone and runs its tests on a simulator.
# Only a Mac can do either, and nothing else here runs on one, so until this
# existed every iPhone-only file - the Keychain storage, the NSURLSession
# HTTP, the iOS database, the back handler, the entry point - was written and
# never built.
#
# It publishes nothing and signs nothing; it answers one question, which is
# whether the shared code is actually shared. The TestFlight build in phase 4
# is the thing that needs signing, and it is an hour long, so finding a
# Kotlin/Native error here instead is worth the Mac minutes.
#
# Runs on any branch but main, when the shared code or the build setup
# changes, and by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'shared/**'
      - 'gradle/libs.versions.toml'
      - '**/*.gradle.kts'
      - '.github/workflows/ios-shared.yml'

jobs:
  ios-shared:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # Kotlin 2.4.21 is tested with Xcode up to 26.4; the runner's default is
      # newer. 26.4 still meets App Store Connect's Xcode 26 requirement.
      - name: Use Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer || { ls /Applications | grep Xcode; exit 1; }
          xcodebuild -version

      # Kotlin/Native's compiler and its iOS libraries, about 1 GB, fetched once.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile the shared code for iPhone and link the framework
        run: gradle :shared:compileKotlinIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64

      # The same agreement tests the JVM runs, on the platform they exist for:
      # the iPhone has no String.format, SimpleDateFormat, org.json or
      # MessageDigest, and this is where the replacements are checked against
      # the answers recorded on the JVM.
      - name: Run the shared tests on an iPhone simulator
        run: |
          IOS_SIMULATOR=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          print(next(d["udid"] for d in devices if d["name"].startswith("iPhone")))')
          echo "Simulator $IOS_SIMULATOR"
          export IOS_SIMULATOR
          gradle :shared:iosSimulatorArm64Test

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-test-report
          path: shared/build/reports/tests
