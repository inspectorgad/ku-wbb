name: Apple keys check

# Confirms the four Apple secrets the iPhone build will use, without printing
# them. ios/check_apple_keys.py says what each check does.
#
# Worth running before the first TestFlight build rather than after: this
# takes half a minute on a Linux runner, where that one takes the better part
# of an hour on a Mac and fails at the very end if a secret is wrong.
#
# Runs by hand, or when the check itself changes on a branch.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/apple-keys-check.yml'
      - 'ios/check_apple_keys.py'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a JWT library
        run: python3 -m pip install --quiet "pyjwt[crypto]==2.10.1"

      - name: Check the keys
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 ios/check_apple_keys.py
