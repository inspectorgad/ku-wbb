name: Publish dashboard to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/ku-wbb-data-validation-qapzd1
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rebuild from the template so the published page always matches the
      # committed seed, even if dashboard.html itself is stale.
      - name: Rebuild dashboard from seed
        run: python3 scripts/build-dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
