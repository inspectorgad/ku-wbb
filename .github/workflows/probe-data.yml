name: Probe KU WBB data sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-ku-wbb.mjs'
      - '.github/workflows/probe-data.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Run data-source probe
        run: node scripts/probe-ku-wbb.mjs

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: probe-evidence
          path: probe/

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe/
          git diff --cached --quiet || git commit -m "Add KU WBB data probe results [skip ci]"
          git push
