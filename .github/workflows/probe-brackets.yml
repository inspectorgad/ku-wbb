name: Probe tournament bracket fields (temporary)

on:
  push:
    paths:
      - 'scripts/probe-brackets.mjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-brackets.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe-brackets/
          git diff --cached --quiet || git commit -m "Add bracket probe results [skip ci]"
          git push
