name: Game night

# Started by a scrape when KU tips off within a few hours (see
# scripts/game-night-watch.mjs). Waits for the game to go final and then
# dispatches the scrape, so a result lands the same night instead of whenever
# the next scheduled run comes round.
run-name: game night ${{ inputs.date }}

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Game date, YYYY-MM-DD (Central)'
        required: true

permissions:
  contents: read
  actions: write

# One watcher per game. Not cancelled on a repeat: the one already waiting is
# the one that knows how long it has waited.
concurrency:
  group: game-night-${{ inputs.date }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # The script hands over to a fresh run at 340 minutes, inside GitHub's
    # six-hour cap, when a watch needs longer than one job allows.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for the final, then scrape
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/game-night-watch.mjs watch "${{ inputs.date }}"
