       Home Screen reads the page it is invoked on, and this is the address
       people share. Without these, installing from the site root produced a
       bare shortcut with no icon and no standalone window, while installing
       from dashboard.html produced the real thing. Same manifest, so either
       entry point installs the same app. -->

  <meta name="theme-color" content="#0051BA">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KU WBB">
</head>

</body>
